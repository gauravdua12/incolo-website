<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Incolo Systems">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- hexagon -->
    <path d="M20 8 H44 L56 24 V40 L44 56 H20 L8 40 V24 Z"
          stroke="#0B2340" stroke-width="4"/>
    <!-- side bars -->
    <path d="M8 26 V38 M56 26 V38" stroke="#0B2340" stroke-width="4"/>
    <!-- stepped circuit -->
    <polyline points="18,44 30,44 30,32 42,32 42,20"
              stroke="#1D65CC" stroke-width="4"/>
  </g>
  <g fill="#1D65CC">
    <circle cx="18" cy="44" r="4.5"/>
    <circle cx="30" cy="32" r="4.5"/>
    <circle cx="42" cy="20" r="4.5"/>
  </g>
  <g fill="#fff">
    <circle cx="18" cy="44" r="1.8"/>
    <circle cx="30" cy="32" r="1.8"/>
    <circle cx="42" cy="20" r="1.8"/>
  </g>
</svg>
